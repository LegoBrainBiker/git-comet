<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My App</title>
        
        <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #map {
            /* configure the size of the map */
            width: 100%;
            height: calc(100% - 37px);
        }
        </style>
        <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
    </head>
    <body>
        <h1 id="locationHeading">Enter Your Location</h1>
        <button id="confirmLocationButton" style="position:absolute; bottom: 10px; right: 10px; z-index: 1000;">Confirm Location</button>
        <div id="map"></div>
        <p id="coordinates" style="position:absolute; bottom: 520px; left: 780px; z-index: 950;">Coordinates will appear here</p>
        <p id="output" style="position:absolute; bottom: 450px; left: 800px; z-index: 950;">Output will appear here</p>
        <script src="./index.js"></script>
    </body>
</html>

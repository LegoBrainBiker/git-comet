<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Git Comet</title>
        <link rel="stylesheet" href="./index.css" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
        <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
    </head>
    <body>
        <h1 id="locationHeading">Enter Your Location</h1>
        <button id="confirmLocationButton" style="position:absolute; bottom: 10px; right: 10px; z-index: 1000;">Confirm Location</button>
        <div id="map">
            <div style="width: 100px;height: 100px;animation: spin;
    animation-duration: 1s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
                left: calc(50% - 50px);
                top: calc(50% - 50px);
                position: absolute;">
                <div style="
                width: 100px;
                height: 100px;
                position: absolute;
                background: #999;
                border-radius: 100%;
            "></div>
                <div style="
                width: 50px;
                height: 50px;
                position: absolute;
                border-top-left-radius: 100%;
                background: #666;
            "></div>
                <div style="
                width: 60px;
                height: 60px;
                position: absolute;
                border-radius: 100%;
                top: 20px;
                left: 20px;
                background: #222;
            "></div>

            </div>
        </div>
        <p id="coordinates" style="position:absolute; bottom: 520px; left: 780px; z-index: 950; color: white;"></p>
        <p id="output" style="position:absolute; bottom: 400px; left: 780px; z-index: 950; color: white;"></p>
        <p id="soilHealth" style="position:absolute; bottom: 385px; left: 780px; z-index: 950; color: white;"></p>
        <script src="./index.js"></script>
    </body>
</html>
